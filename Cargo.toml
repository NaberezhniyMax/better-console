[package]
name = "server-console"
version = "0.1.0"
edition = "2021"
description = "Server console with a clean light/dark UI, syntax highlighting and custom command buttons"

[dependencies]
eframe = "0.27"
arboard = "3.7"
image = { version = "0.25", default-features = false, features = ["ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
regex = "1"
portable-pty = "0.9.0"
vt100 = "0.18.1"

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.19.3", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
